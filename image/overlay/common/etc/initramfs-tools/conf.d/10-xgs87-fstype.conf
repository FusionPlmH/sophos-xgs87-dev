# The root filesystem is ext4 on both machines, so there is nothing to probe.
#
# This is not cosmetic.  initramfs-tools' stock "fsck" hook asks /etc/fstab
# what type "/" is, then -- for the root entry only -- throws that answer away
# and probes the device with klibc's fstype(1) instead.  Inside a chroot there
# is no /dev/mmcblk0p2 or /dev/loop0p2 to probe, so the probe returns nothing,
# the hook finds no filesystem types to support and exits without copying
# anything.  The result was an initramfs with no fsck(8) in it at all, and
# every boot logging
#
#   Warning: fsck not present, so skipping root file system
#
# -- measured on the x86 (2026-11-25 09:0x, first boot of the 762 MB image).
# With FSTYPE set, the hook takes its non-probing branch and copies fsck,
# fsck.ext4 and logsave; see also hooks/xgs87-e2fsck, which is the belt to
# this braces (copy_exec can still fail under qemu-user on the arm64 build).
FSTYPE=ext4
