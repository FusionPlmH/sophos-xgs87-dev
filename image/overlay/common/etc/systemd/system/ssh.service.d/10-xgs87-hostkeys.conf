# The image deliberately ships without /etc/ssh/ssh_host_* -- baking them would
# give every card the same identity -- and Debian 13's ssh.service only runs
# `sshd -t` before starting, so it exits with "no hostkeys available".
#
# The gen key step has to live in this unit rather than in a separate oneshot:
# a `DefaultDependencies=no` unit ordered Before=ssh.service ran, reported
# success and still left no keys behind (it is too early in boot), while a
# normal unit would be ordered *after* the sshd -t that fails.  Clearing
# ExecStartPre first keeps the order right: generate, then verify, then start.
[Service]
ExecStartPre=
ExecStartPre=/usr/bin/ssh-keygen -A
ExecStartPre=/usr/sbin/sshd -t
