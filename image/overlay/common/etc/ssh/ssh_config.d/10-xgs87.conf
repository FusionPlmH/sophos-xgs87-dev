# 新装的机器第一次 ssh 过去不该停下来问 yes/no。
Host *
	StrictHostKeyChecking accept-new

# 密码只输一次：第一条连接留在后台，后面所有 ssh/scp（包括脚本里的
# BatchMode）都复用这条连接，12 小时内不再问密码。不用生成钥匙、不用把
# 私钥塞进镜像，重装一台也只是再输一次密码。
Host *
	ControlMaster auto
	ControlPath ~/.ssh/cm-%r@%h-%p
	ControlPersist 12h
	ServerAliveInterval 30
	ServerAliveCountMax 3
