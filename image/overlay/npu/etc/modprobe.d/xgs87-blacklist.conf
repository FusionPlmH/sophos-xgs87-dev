# Drivers this board cannot use, so they should not probe and fail on every boot.
#
# crypto_safexcel (EIP197): the kernel driver needs Inside Secure's ifpp.bin
# microcode, which this image does not ship; without it the probe fails with
# -ENOENT and the driver gives up.  Even with the firmware the PE never starts
# on CN9130, and single-core AES-256-GCM already runs at ~8.5 Gbps, so hardware
# offload has no payoff here.  See docs/14 §7.4.  To experiment anyway:
#   apt install firmware-misc-nonfree
#   rm /etc/modprobe.d/xgs87-blacklist.conf
blacklist crypto_safexcel
