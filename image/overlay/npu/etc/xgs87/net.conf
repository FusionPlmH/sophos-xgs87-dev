# XGS 87 的 WAN / LAN 划分（NPU 侧读这个文件）
#
# 面板丝印：1/LAN = p1，2/WAN = p2，3 = p3，4 = p4，p8 = 前面板那个调试口。
#
#   br-wan = eth0.100 + p2  -> 上游 / WAN / 管理，自己 DHCP 拿地址
#   br-lan = eth0.200 + p1  -> 设备下游，本机静态 10.234.56.1/24，不下发 DHCP
#                              （下游要用得自己配 10.234.56.x）
#
# 两条 vNTB VLAN 一直延伸到 x86：eth0.100（x86 也 DHCP）和 eth0.200
# （x86 静态 10.234.56.2/24），所以插在面板 1/LAN 上能同时 ssh 到两台机器。
#
# 模式：dhcp（在这个桥上跑 dhcpcd）| static（用 *_ADDR，可多个，空格分隔）
#       | none（只要桥和口，不配地址）
#
# p3 / p4 / p8 不并入任何桥（原来是 p4 走家里内网、p8 是独立管理口，都退掉了）。
# 想让前面板 p8 也能当调试口，把 p8 加到 LAN_PORTS 即可。

# ---- WAN（面板 2 / WAN）----
WAN_PORTS="p2"
WAN_MODE="dhcp"
WAN_VID="100"
# 例：WAN_MODE="static"  WAN_ADDR="203.0.113.2/24"  WAN_GW="203.0.113.1"

# ---- LAN（面板 1/LAN）----
LAN_PORTS="p1"
LAN_MODE="static"
LAN_ADDR="10.234.56.1/24"
LAN_VID="200"
# LAN 上没有 DHCP 服务；下游设备要自己配 10.234.56.x /24，网关 .1
