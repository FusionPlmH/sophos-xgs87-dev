# XGS 87 的 WAN / LAN 划分（NPU 侧读这个文件）
#
# 面板丝印：1/LAN = p1，2/WAN = p2，3 = p3，4 = p4，SFP = sfp。
#
# 两个桥各自独立，并且各用一条 vNTB 上的 VLAN 延伸到 x86：
#   br-lan  VLAN 31   ← 原来 p4 那条"家里内网"通道就是它
#   br-wan  VLAN 32   ← 新增，默认不给 x86 配地址（想让它看 WAN 再开）
#
# 模式：dhcp（默认）| static | none
#   dhcp   : 在这个桥上跑 dhcpcd，从上游拿地址
#   static : 用 *_ADDR 里的地址（可多个，空格分隔）
#   none   : 只要桥和口，不配地址

# ---- WAN（面板 2 / WAN）----
WAN_PORTS="p2"
WAN_MODE="dhcp"
# 例：WAN_MODE="static"  WAN_ADDR="203.0.113.2/24"  WAN_GW="203.0.113.1"

# ---- LAN（面板 1、3、4）----
# p4 留在 LAN 里，因为现在就是靠它把家里内网接到机器上；
# 只把 2 号口划出去当 WAN，原有行为不变。
LAN_PORTS="p1 p3 p4"
LAN_MODE="dhcp"
# 例：LAN_MODE="static"  LAN_ADDR="192.168.31.2/24"

# ---- VLAN / 管理段 ----
# 管理段 br-mgmt = p8 + eth0.100，地址在 xgs-mgmt-bridge.sh 里，这里只给 VLAN 号。
MGMT_VID="100"
LAN_VID="31"
WAN_VID="32"
