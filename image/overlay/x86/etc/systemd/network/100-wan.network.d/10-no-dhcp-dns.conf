# Keep the DHCP lease for the address, route and MTU, but not for DNS: the
# default resolvers live in /etc/systemd/resolved.conf.d/xgs87-dns.conf
# (1.1.1.1 / 8.8.8.8).  Without this, systemd-resolved prefers the per-link
# servers from the lease and the global list is never used.
[DHCPv4]
UseDNS=no
