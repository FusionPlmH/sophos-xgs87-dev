[Resolve]
# Public resolvers as the default DNS on the x86 side.  systemd-networkd still
# receives the DHCP servers, but an explicit global DNS= wins over link DNS, so
# these two are what the machine actually uses.  Clear this file to fall back to
# DHCP-provided servers.
DNS=1.1.1.1 8.8.8.8
FallbackDNS=
