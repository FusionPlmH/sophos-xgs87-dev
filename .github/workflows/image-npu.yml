name: image npu

# Builds on a native arm64 runner (free for public repositories) so there is no
# qemu and no cross-compilation.  Overwrites the fixed release `debian-npu`;
# its notes come from image/release-npu.md.

on:
  # 手动触发：Actions → image npu → Run workflow，或 `gh workflow run image-npu.yml`
  workflow_dispatch:
    inputs:
      variant:
        description: 'full (with DKMS toolchain) or base'
        default: 'full'

permissions:
  contents: write

concurrency:
  group: image-npu-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4

      - name: Confirm we are actually on aarch64
        run: uname -m && test "$(uname -m)" = aarch64

      - name: Decide variant
        id: vars
        run: |
          VARIANT="${{ github.event.inputs.variant }}"
          echo "variant=${VARIANT:-full}" >> "$GITHUB_OUTPUT"

      - name: Install mmdebstrap
        run: |
          sudo apt-get update
          sudo apt-get install -y mmdebstrap zstd device-tree-compiler

      - name: Debian archive keys
        # Ubuntu's debian-archive-keyring predates trixie, so mmdebstrap cannot
        # verify the trixie Release file and stops with NO_PUBKEY.
        run: |
          cd /tmp
          curl -fsS http://deb.debian.org/debian/pool/main/d/debian-archive-keyring/ \
            | grep -o 'debian-archive-keyring_[0-9.]*_all\.deb' | sort -uV | tail -1 > kr.name
          curl -fsSLO "http://deb.debian.org/debian/pool/main/d/debian-archive-keyring/$(cat kr.name)"
          sudo dpkg -i "$(cat kr.name)"

      - name: Build rootfs (native arm64)
        run: |
          sudo bash ./image/build.sh --arch arm64 --variant "${{ steps.vars.outputs.variant }}" \
            --out out/debian-npu.tar.zst

      - name: Build the board DTB
        run: bash ./tools/build/build-dtb.sh

      - name: Report
        run: |
          ls -lh out/
          tar --use-compress-program=unzstd -tf out/debian-npu.tar.zst \
            | grep -E '^\./(boot|usr/local/sbin|etc/systemd/system)/' | head -12

      - uses: actions/upload-artifact@v4
        with:
          name: xgs87-npu
          path: |
            out/debian-npu.tar.zst
            out/cn9130-sophos-xgs87w-sfp10g.dtb
          retention-days: 7

  release:
    needs: build
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: xgs87-npu
          path: out

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: debian-npu
        run: |
          set -e
          ls -lh out/
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --title "$TAG" --notes-file image/release-npu.md
          else
            gh release create "$TAG" --title "$TAG" --notes-file image/release-npu.md
          fi
          for f in out/debian-npu.tar.zst out/cn9130-sophos-xgs87w-sfp10g.dtb; do
            for i in 1 2 3 4 5; do
              gh release upload "$TAG" "$f" --clobber && break || sleep 5
            done
          done
          gh release view "$TAG" --json assets --jq '.assets[].name'