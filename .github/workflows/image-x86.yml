name: image x86

# Builds on a native amd64 runner -- no cross-compilation, no qemu.
# Overwrites the fixed release `debian-x86`; its notes come from
# image/release-x86.md so the install instructions live next to the code.

on:
  # 手动触发：Actions → image x86 → Run workflow，或 `gh workflow run image-x86.yml`
  workflow_dispatch:
    inputs:
      variant:
        description: 'full (with DKMS toolchain) or base'
        default: 'full'
      size:
        description: 'disk image size (auto = rootfs + 15% + 256 MiB + 476 MiB ESP, grown on first boot)'
        default: 'auto'

permissions:
  contents: write

concurrency:
  group: image-x86-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Decide variant
        id: vars
        run: |
          VARIANT="${{ github.event.inputs.variant }}"
          echo "variant=${VARIANT:-full}" >> "$GITHUB_OUTPUT"

      - name: Install mmdebstrap
        run: |
          sudo apt-get update
          sudo apt-get install -y mmdebstrap zstd dosfstools fdisk mtools

      - name: Debian archive keys
        # Ubuntu's debian-archive-keyring predates trixie, so mmdebstrap cannot
        # verify the trixie Release file and stops with NO_PUBKEY.
        run: |
          cd /tmp
          curl -fsS http://deb.debian.org/debian/pool/main/d/debian-archive-keyring/ \
            | grep -o 'debian-archive-keyring_[0-9.]*_all\.deb' | sort -uV | tail -1 > kr.name
          curl -fsSLO "http://deb.debian.org/debian/pool/main/d/debian-archive-keyring/$(cat kr.name)"
          sudo dpkg -i "$(cat kr.name)"

      - name: Build rootfs
        run: |
          sudo bash ./image/build.sh --arch amd64 --variant "${{ steps.vars.outputs.variant }}" \
            --out "out/xgs87-x86-${{ steps.vars.outputs.variant }}.tar.zst"

      - name: Build bootable image
        run: |
          sudo bash ./image/mkdisk.sh \
            --rootfs "out/xgs87-x86-${{ steps.vars.outputs.variant }}.tar.zst" \
            --out out/debian-x86.img \
            --size "${{ github.event.inputs.size || 'auto' }}"
          zstd -T0 -10 -f --rm out/debian-x86.img

      - name: Report
        run: |
          ls -lh out/
          df -h / | tail -1

      - uses: actions/upload-artifact@v4
        with:
          name: xgs87-x86
          path: |
            out/debian-x86.img.zst
            out/xgs87-x86-*.tar.zst
          retention-days: 7

  release:
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: xgs87-x86
          path: out

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: debian-x86
        run: |
          set -e
          ls -lh out/
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --title "$TAG" --notes-file image/release-x86.md
          else
            gh release create "$TAG" --title "$TAG" --notes-file image/release-x86.md
          fi
          for i in 1 2 3 4 5; do
            gh release upload "$TAG" out/debian-x86.img.zst --clobber && break || sleep 5
          done
          gh release view "$TAG" --json assets --jq '.assets[].name'